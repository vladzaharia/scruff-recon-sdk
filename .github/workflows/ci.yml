# Security note: this workflow interpolates only trusted values — matrix entries
# defined below and `env.GO_VERSION`. No `run:` step interpolates
# `github.event.*` data, so there is no workflow-injection surface.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  modules:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, recon, scruff]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Unit tests must never reach the network. The integration tests that do
      # are behind the `integration` build tag and are not run here.
      - name: Test
        run: go test -race ./...

      - name: Integration tests compile
        run: go vet -tags integration ./...

  stdlib-only:
    name: core is stdlib-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # core's dependency-free-ness is a promise this repo makes to consumers,
      # so it is enforced rather than documented. Asserting on go.mod's require
      # block is the precise form of that promise: `go list -deps` also reports
      # the toolchain's own vendored stdlib (vendor/golang.org/x/...), and
      # `go list -m all` reports every module in the workspace.
      - name: Assert core has no requires
        working-directory: core
        run: |
          req=$(go mod edit -json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("Require") or "")')
          if [ -n "$req" ]; then
            echo "::error::core gained a dependency:"; echo "$req"; exit 1
          fi

  consumer:
    name: builds as a consumer sees it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # recon and scruff carry `replace core => ../core`, which Go applies only
      # from the main module. That makes local builds resolve core from the
      # working tree while consumers resolve the *required version* -- so a
      # stale require silently passes here and fails for everyone else. It did:
      # v0.2.0 shipped using core.AddQuery while requiring a core that predated
      # it. Dropping the replace reproduces the consumer's view.
      #
      # If the required core version is not tagged yet, that is the normal state
      # between "core gains a symbol" and "core is tagged", so warn rather than
      # fail. A version that resolves but does not compile is a real break.
      - name: Build against the required core version
        run: |
          for m in recon scruff; do
            ( cd "$m"
              go mod edit -dropreplace=github.com/vladzaharia/scruff-recon-sdk/core
              if ! go mod download github.com/vladzaharia/scruff-recon-sdk/core 2>/dev/null; then
                echo "::warning::$m requires a core version that is not published yet; skipping"
                exit 0
              fi
              if ! go build ./...; then
                echo "::error::$m does not compile against the core version it requires"
                exit 1
              fi
            ) || exit 1
          done

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      # Invoked directly rather than through gitleaks-action, which derives a
      # commit range of <first-pushed-commit>^..<head>. On a repository's first
      # push that commit is the root commit, which has no parent, so the range
      # is invalid and the job fails. Scanning the whole history is both what we
      # want and what runs locally, and it drops a third-party action from the
      # supply chain for a one-line task.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Honours .gitleaksignore if present.
      - name: Scan full history
        run: gitleaks detect --no-banner --redact --exit-code 1

  openapi:
    name: openapi specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The specs are hand-written, and YAML flow mappings make one mistake very
      # easy to miss: an unquoted `description:` containing a comma ends at that
      # comma, silently truncating the text and turning the remainder into bogus
      # keys. Twelve descriptions in these files had done exactly that. Linting
      # catches it; reading does not.
      - name: Lint
        working-directory: docs/openapi
        run: npx --yes @redocly/cli@latest lint recon.yaml scruff.yaml

  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Renaming a heading silently breaks every link to it — and adding a
      # provenance tag to a heading changes its anchor, which is easy to miss.
      - name: Check internal links and anchors
        run: |
          python3 - <<'PY'
          import glob, os, re, sys

          def slug(h):
              s = re.sub(r'`', '', h.strip().lower())
              s = re.sub(r'[^\w\s-]', '', s)
              return s.replace(' ', '-')

          files = sorted(set(glob.glob('**/*.md', recursive=True)))
          anchors = {
              os.path.normpath(f): {
                  slug(m.group(2))
                  for m in (re.match(r'^(#{1,6})\s+(.*)', l) for l in open(f))
                  if m
              }
              for f in files
          }

          bad = []
          for f in files:
              d = os.path.dirname(f)
              for m in re.finditer(r'\]\(([^)\s]+)\)', open(f).read()):
                  link = m.group(1)
                  if link.startswith(('http', 'mailto:', '#!')) or link == 'url':
                      continue
                  path, _, anc = link.partition('#')
                  tgt = os.path.normpath(os.path.join(d, path)) if path else os.path.normpath(f)
                  if path and not os.path.exists(tgt):
                      bad.append(f'{f} -> {link} (missing file)')
                      continue
                  if anc and anc not in anchors.get(tgt, set()):
                      bad.append(f'{f} -> {link} (missing anchor)')

          for b in bad:
              print(f'::error::{b}')
          sys.exit(1 if bad else 0)
          PY
